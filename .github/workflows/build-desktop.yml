name: Build Desktop App

# デスクトップアプリ（apps/desktop）のインストーラを作り、タグのリリースに載せる。
# 処理は別に入れる gqfilter（build-windows / build-macos / build-linux の成果物）を呼ぶ。
# 署名はまだしていない。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb
            files: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gq-filter-desktop-${{ runner.os }}
          path: ${{ matrix.files }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
