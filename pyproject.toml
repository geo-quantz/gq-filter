[project]
name = "gq-filter"
version = "1.4.0"
description = "PDAL-based point cloud filtering CLI for surveying workflows (GeoQuantz free edition)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pdal>=3.5.3",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mcp>=2,<3",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gq_filter"]
